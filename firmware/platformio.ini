; PlatformIO Project Configuration File for PanzerNavSystem
; Target Hardware: ESP-12E / NodeMCU v2 (ESP8266EX)

[platformio]
default_envs = nodemcuv2
data_dir = data

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; 4MB Flash configuration: 2MB Sketch, 2MB LittleFS
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

; CPU Frequency: 160MHz for smooth radar sweep and responsive WebSocket serving
board_build.f_cpu = 160000000L

; Upload configuration (can be overridden via upload_firmware.bat / command line)
upload_speed = 460800
monitor_speed = 115200

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D BEARSSL_SSL_BASIC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS=0

; Environment for bare ESP-12E module / generic board
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
board_build.f_cpu = 160000000L
upload_speed = 460800
monitor_speed = 115200

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D BEARSSL_SSL_BASIC
